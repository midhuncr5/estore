{%extends 'store/base.html'%}


{%block 'mainblock'%}





<div class="grid min-h-screen ">
    <div class="col-span-full py-6 px-4 sm:py-12 lg:col-span-6 lg:py-24">
      <div class="mx-auto w-full max-w-lg">
        <h1 class="relative text-2xl font-medium text-gray-700 sm:text-3xl">USER DETAILS<span class="mt-2 block h-1 w-10 bg-teal-600 sm:w-20"></span></h1>
        <form action="" method="post" class="mt-10 flex flex-col space-y-4">
            {%csrf_token%}
          <div><label for="" class="text-xs font-semibold text-gray-500">Email</label><input type="email" id="email" name="email" placeholder="user@gmail.com" class="mt-1 block w-full rounded border-gray-300 bg-gray-50 py-3 px-4 text-sm placeholder-gray-300 shadow-sm outline-none transition focus:ring-2 focus:ring-teal-500" /></div>
          <div><label for="" class="text-xs font-semibold text-gray-500">name</label><input type="text" id="name" name="name" placeholder="midhun " class="mt-1 block w-full rounded border-gray-300 bg-gray-50 py-3 px-4 text-sm placeholder-gray-300 shadow-sm outline-none transition focus:ring-2 focus:ring-teal-500" /></div>
          <div><label for="" class="text-xs font-semibold text-gray-500">address</label><input type="text" id="address" name="address" placeholder="address" class="mt-1 block w-full rounded border-gray-300 bg-gray-50 py-3 px-4 text-sm placeholder-gray-300 shadow-sm outline-none transition focus:ring-2 focus:ring-teal-500" /></div>
          <div><label for="" class="text-xs font-semibold text-gray-500">phone</label><input type="number" id="phone" name="phone" placeholder="81291290005" class="mt-1 block w-full rounded border-gray-300 bg-gray-50 py-3 px-4 text-sm placeholder-gray-300 shadow-sm outline-none transition focus:ring-2 focus:ring-teal-500" /></div>

          
        <p class="mt-10 text-center text-sm font-semibold text-gray-500">By placing this order you agree to the <a href="#" class="whitespace-nowrap text-teal-400 underline hover:text-teal-600">Terms and Conditions</a></p>
        <button type="submit" class="mt-4 inline-flex w-full items-center justify-center rounded bg-teal-600 py-2.5 px-4 text-base font-semibold tracking-wide text-white text-opacity-80 outline-none ring-offset-2 transition hover:text-opacity-100 focus:ring-2 focus:ring-teal-500 sm:text-lg">confirm</button>
        </form>
      </div>
    </div>


{%endblock%}
