{%extends 'store/base.html'%}


{%block 'mainblock'%}


{%if messages%}
{%for m in messages%}
<div class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>{{m}}</strong> 
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

{%endfor%}
{%endif%}


<div class="mx-auto grid w-full max-w-7xl   items-center space-y-4 px-2 py-10 md:grid-cols-2 md:gap-6 md:space-y-0 lg:grid-cols-4">
  {%for p in product%}
  <div class="rounded-md border shadow-lg 3px 4px bg-white ">
    <img class="aspect-[16/9] w-full rounded-md md:aspect-auto md:h-[200px] lg:h-[200px]" src="{{p.product_pic.url}}" alt="image description">

   <div class="p-4">
     <h1 class="inline-flex items-center text-lg font-semibold text-black">
       {{p.title}} 
     </h1>
   
     <div class="mt-4">
 
      
       <span class="mb-2 mr-2 inline-block rounded-full bg-gray-100 px-3 py-1 text-[10px] font-semibold text-gray-900">
         {%for t in p.tag_object.all%}
 
         <span>#{{t}} </span>
         {%endfor%}
       </span>
      
     </div>
     
     <div class="mt-2 flex items-center space-x-2">
       <span class="block text-md font-semibold text-black">price:</span>
       <!-- display Price -->
       <span class="block cursor-pointer rounded-md  p-1 px-2 text-md font-semibold  text-black ">
         {{p.price}} Rs.
       </span>
     
     </div>
     <div class="mt-2 flex items-center space-x-2">
     <a href="{%url 'product-detail' p.id%}"
       type="button"
       class="mt-4 w-1/2  rounded-md bg-indigo-600 px-2 py-1.5 text-sm font-semibold text-white text-center shadow-sm hover:bg-green/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black"
     >
       VIEW MORE
     </a>

     <a href="{%url 'cart-add' p.id%}"
     type="button"
     class="mt-4 w-1/2  rounded-md bg-purple-600 px-2 py-1.5 text-sm font-semibold text-white text-center shadow-sm hover:bg-green/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black"
   >
     ADD TO CART
   </a>
     

     
  
 
   
    </div>
   </div>
 </div>
 
 
 
 
 
  {%endfor%}
 
 </div>

      
       

{%endblock%}
