{%extends 'store/base.html'%}

{%block 'mainblock'%}


<div class="container mt-5">
  <div class="row">
      <div class="col-3"></div>
      <div class="col-6">
    

        <div class="card mb-3" style="max-width: 540px;">
          <div class="row g-0">
            <div class="col-md-4">
              <img src="{{product.product_pic.url}}" class="" alt="..." width="100%" height="50%" >
            </div>
            <div class="col-md-8">
              <div class="card-body">
                <h5 class="card-title">{{product.title}}</h5>
                <p class="card-text">{{product.description}}</p>
                <p class="card-text"><b>brand :</b>{{product.brand_object}}</p>
                <p class="card-text" style="font-weight: bold;">{{product.price}} R.s</p>

                
              </div>

            </div>
          </div>
        </div>

        <div>
      

        
         
        </div>

        <div>
        
        <a href="{%url 'product-detail' product.id%}" class="btn btn-info"> back to product</a>

        
          <a href="{%url 'single-checkout' product.id%}" type="button" class="mb-5 group inline-flex w-[200px] ml-[200px] items-center justify-center rounded-md bg-purple-600 px-3 py-2 text-lg font-semibold text-white transition-all duration-200 ease-in-out focus:shadow hover:bg-gray-800">
            Place Order
            <svg xmlns="http://www.w3.org/2000/svg" class="group-hover:ml-8 ml-4 h-6 w-6 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </a>
        
        
        </div>
        


      </div>
      <div class="col-3"></div>
      
  </div>
</div>







{%endblock%}
